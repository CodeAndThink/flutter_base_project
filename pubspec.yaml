name: flutter_base_project
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  #Stage Manager
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1

  #Network
  dio: ^5.9.1
  retrofit: ^4.9.2
  dart_either: ^2.0.0

  #UI
  another_flushbar: ^1.12.32
  flutter_svg: ^2.2.4
  responsive_framework: ^1.5.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.2
  flutter_slidable: ^4.0.3
  cached_network_image: ^3.4.1

  #Navigation
  go_router: ^17.2.0

  #Storage
  shared_preferences: ^2.5.5
  flutter_dotenv: ^6.0.0
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2

  #Utils
  intl_utils: ^2.8.10
  haptic_feedback: ^0.6.4+3
  injectable: ^2.7.1+4
  path_provider: ^2.1.5
  photo_manager: ^3.9.0
  photo_manager_image_provider: ^2.1.0
  google_fonts: ^8.0.2
  equatable: ^2.0.8
  image_picker: ^1.1.2
  image: ^4.3.0
  image_pixels: ^4.0.2
  native_exif: ^0.7.0
  exif: ^3.3.0
  path: ^1.9.1
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  permission_handler: ^12.0.3
  connectivity_plus: ^6.1.4
  camera: ^0.12.0+1
  tutorial_coach_mark: ^1.3.3
  device_info_plus: ^13.1.0
  flutter_secure_storage: ^10.3.1
  uuid: ^4.5.3
  flex_color_picker: ^3.8.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  retrofit_generator: ^10.2.3
  build_runner: ^2.11.1
  json_serializable: ^6.13.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    
